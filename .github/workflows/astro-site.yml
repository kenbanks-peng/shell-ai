name: Deploy Astro site to Pages

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  changes:
    name: Check site changes
    runs-on: ubuntu-latest
    outputs:
      site_changed: ${{ steps.check.outputs.site_changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for site changes since the last release
        id: check
        shell: bash
        run: |
          set -euo pipefail

          release_commit="$(git rev-parse "${GITHUB_REF_NAME}^{}")"
          previous_tag="$(git describe --tags --abbrev=0 "${release_commit}^" 2>/dev/null || true)"

          if [ -z "$previous_tag" ]; then
            empty_tree="$(git hash-object -t tree /dev/null)"
            comparison_ref="$empty_tree"
          else
            comparison_ref="$previous_tag"
          fi

          if git diff --quiet "$comparison_ref" "$release_commit" -- site/; then
            echo "site_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.site_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: npm ci
        working-directory: site
      - name: Build with Astro
        run: npm run build -- --site "${{ steps.pages.outputs.origin }}" --base "${{ steps.pages.outputs.base_path }}"
        working-directory: site
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Deploy
    needs: [changes, build]
    if: needs.changes.outputs.site_changed == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
