[package]
name = "shell-ai"
version = "0.1.0"
edition = "2024"
description = "Fast shell-command suggestions"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dialoguer = "0.11"
directories = "6.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
skim = { version = "5.6.5", default-features = false }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["time"] }
url = "2.5"
unicode-width = "0.2"
