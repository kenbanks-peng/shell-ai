<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  {{ $siteData := hugo.Data.site }}
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ $siteData.description }}{{ end }}" />
  <title>{{ if .IsHome }}{{ $siteData.title }}{{ else }}{{ .Title }} | {{ $siteData.title }}{{ end }}</title>
  <link rel="canonical" href="{{ .Permalink }}" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{{ if .IsHome }}{{ $siteData.title }}{{ else }}{{ .Title }} | {{ $siteData.title }}{{ end }}" />
  <meta property="og:description" content="{{ $siteData.description }}" />
  <meta property="og:url" content="{{ .Permalink }}" />
  <meta name="twitter:card" content="summary" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  {{ with resources.Get "css/styles.css" | minify | fingerprint }}
    <link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" />
  {{ end }}
</head>
