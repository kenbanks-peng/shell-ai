{{ $demo := hugo.Data.home.demo }}
<div class="demo-wrap" role="region" aria-label="{{ $demo.label }}">
  <div class="terminal">
    <div class="terminal-bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span> {{ hugo.Data.site.productName }}</div>
    <pre><span class="prompt">?</span> {{ $demo.prompt }}
<span class="answer">$</span> {{ $demo.answer }}</pre>
  </div>
</div>
