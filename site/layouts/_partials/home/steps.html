{{ $steps := hugo.Data.home.steps }}
<section id="how-it-works">
  <div class="shell">
    <div class="section-heading">
      <p class="eyebrow">{{ $steps.eyebrow }}</p>
      <h2>{{ $steps.title }}</h2>
      <p>{{ $steps.lede }}</p>
    </div>
    <div class="cards">
      {{ range $steps.items }}
        {{ partial "home/step-card.html" . }}
      {{ end }}
    </div>
  </div>
</section>
