{{ define "main" }}
  {{ $siteData := site.Params }}
  <main id="main" class="content-page">
    <article class="shell">
      <p class="eyebrow">{{ $siteData.integrationEyebrow }}</p>
      <h1>{{ .Title }}</h1>
      <div class="prose">{{ .Content }}</div>
      {{ with .CurrentSection }}
        <a class="button secondary" href="{{ .RelPermalink }}">{{ $siteData.pages.viewIntegrationsLabel }}</a>
      {{ end }}
    </article>
  </main>
{{ end }}
