{{ $siteData := hugo.Data.site }}
<header>
  <nav class="shell" aria-label="{{ $siteData.mainNavigationLabel }}">
    <a class="brand" href="{{ site.Home.RelPermalink }}#top" aria-label="{{ $siteData.homeLabel }}"><span class="mark" aria-hidden="true">$_</span>{{ $siteData.productName }}</a>
    <div class="nav-links">
      {{ range $siteData.navigation }}
        {{ $url := .url }}
        {{ if hasPrefix $url "#" }}{{ $url = printf "%s%s" site.Home.RelPermalink $url }}{{ end }}
        <a href="{{ $url }}">{{ .label }}</a>
      {{ end }}
    </div>
  </nav>
</header>
