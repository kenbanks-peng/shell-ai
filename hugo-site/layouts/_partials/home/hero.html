{{ $hero := .Params.hero }}
<div class="shell" id="top">
  <section class="hero" aria-labelledby="hero-heading">
    <p class="eyebrow">{{ $hero.eyebrow }}</p>
    <h1 id="hero-heading">{{ $hero.titleBefore }}<br /><span>{{ $hero.titleHighlight }}</span></h1>
    <p class="lede">{{ $hero.lede }}</p>
    <div class="actions">
      <a class="button primary" href="#install">{{ $hero.primaryCta }}</a>
      <a class="button secondary" href="{{ site.Params.repository }}">{{ $hero.secondaryCta }}</a>
    </div>
  </section>
  {{ partial "home/terminal-demo.html" . }}
</div>
